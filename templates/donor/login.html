{% extends 'base.html' %}
{% block title %}BloodCare | Donor Login{% endblock %}

{% block extra_head %}
<style>
/* ================= LOGIN CARD ================= */
.login-card {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(14px);
    border-radius: 28px;
    padding: 45px 40px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.15);
}

.login-header {
    text-align: center;
    margin-bottom: 30px;
}

.login-icon {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: linear-gradient(135deg, #dc2626, #ef4444);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto;
    box-shadow: 0 15px 40px rgba(220,38,38,0.45);
}

.login-icon i {
    font-size: 34px;
    color: white;
}

/* ================= FORM ================= */
.form-control {
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 0.95rem;
}

.form-control:focus {
    border-color: #dc2626;
    box-shadow: 0 0 0 0.15rem rgba(220,38,38,0.25);
}

.login-btn {
    padding: 12px;
    font-weight: 600;
    border-radius: 999px;
}

/* ================= LINK ================= */
.login-link a {
    font-weight: 600;
    color: #dc2626;
    text-decoration: none;
}

.login-link a:hover {
    text-decoration: underline;
}

/* ================= MOBILE ================= */
@media (max-width: 768px) {
    .login-card {
        padding: 35px 25px;
    }
}
</style>
{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-lg-4 col-md-6 fade-up">

        <div class="login-card">

            <div class="login-header">
                <div class="login-icon mb-3">
                    <i class="bi bi-person-heart"></i>
                </div>
                <h3 class="fw-bold mb-1">Donor Login</h3>
                <p class="text-muted">Welcome back. Let’s save lives ❤️</p>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Username"
                           required>
                </div>

                <div class="mb-4">
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Password"
                           required>
                </div>

                <button type="submit" class="btn btn-main w-100 login-btn">
                    Login
                </button>
            </form>

            <p class="mt-4 text-center login-link">
                New donor?
                <a href="{% url 'donor:donor_register' %}">
                    Create an account
                </a>
            </p>

        </div>

    </div>
</div>

{% endblock %}
