{% extends 'base.html' %}
{% block title %}Send Arrival Time | BloodCare{% endblock %}

{% block extra_head %}
<style>
.arrival-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.08);
    overflow: hidden;
    margin-top: 20px;
}

.arrival-header {
    background: linear-gradient(135deg, #dc2626, #b91c1b);
    color: white;
    padding: 25px 20px;
    border-radius: 24px 24px 0 0;
    text-align: center;
}

.arrival-header h4 {
    font-weight: 800;
    margin-bottom: 5px;
}

.arrival-body {
    padding: 30px;
}

.btn-send {
    background: linear-gradient(135deg, #dc2626, #b91c1b);
    color: white;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
}

.btn-send:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(220,53,69,0.3);
}

.btn-cancel {
    min-width: 120px;
}
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-lg-6 col-md-8">

        <div class="arrival-card">

            <!-- HEADER -->
            <div class="arrival-header">
                <h4>🕒 Send Arrival Time</h4>
                <p class="mb-0">To: <strong>{{ req.hospital.hospital_name }}</strong></p>
            </div>

            <!-- BODY -->
            <div class="arrival-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="arrival_time" class="form-label fw-semibold">Arrival Time</label>
                        <input type="text" name="arrival_time" id="arrival_time" class="form-control" placeholder="e.g. 10:30 AM" required>
                        <small class="text-muted">Provide the estimated time you will reach the hospital.</small>
                    </div>

                    <div class="d-flex gap-2 flex-wrap">
                        <button type="submit" class="btn btn-send px-4">Send</button>
                        <a href="{% url 'donor:donor_dashboard' %}" class="btn btn-outline-secondary btn-cancel">Cancel</a>
                    </div>
                </form>
            </div>

        </div>

    </div>
</div>
{% endblock %}
